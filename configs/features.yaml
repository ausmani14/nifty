    notes: null
  low_to_close_dist:
    name: low_to_close_dist
    category: ohlc_shape
    formula: (close_t - low_t) / close_t
    lookback_period: 1
    input_columns:
    - low
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Normalized distance between official close and session low.
    leakage_risk: none
    notes: null
  sma_ratio_20_50:
    name: sma_ratio_20_50
    category: trend
    formula: (sma_20 / sma_50) - 1
    lookback_period: 50
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Spread between 20-day and 50-day moving averages.
    leakage_risk: none
    notes: null
  sma_ratio_50_200:
    name: sma_ratio_50_200
    category: trend
    formula: (sma_50 / sma_200) - 1
    lookback_period: 200
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Spread between 50-day and 200-day moving averages (Golden/Death cross
      proxy).
    leakage_risk: none
    notes: null
  trend_slope_20d:
    name: trend_slope_20d
    category: trend
    formula: linear_regression_slope(close_(t-19:t)) / mean(close)
    lookback_period: 20
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Normalized linear regression slope of closing prices over trailing
      20 days.
    leakage_risk: none
    notes: null
  day_of_week:
    name: day_of_week
    category: calendar
    formula: trading_date.weekday()
    lookback_period: 0
    input_columns:
    - trading_date
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Day of week integer (0=Monday, 1=Tuesday, ..., 4=Friday, 5=Saturday).
    leakage_risk: none
    notes: null
  day_of_month:
    name: day_of_month
    category: calendar
    formula: trading_date.day
    lookback_period: 0
    input_columns:
    - trading_date
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Day of the month integer (1 to 31).
    leakage_risk: none
    notes: null
  month:
    name: month
    category: calendar
    formula: trading_date.month
    lookback_period: 0
    input_columns:
    - trading_date
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Calendar month integer (1 to 12).
    leakage_risk: none
    notes: null
  quarter:
    name: quarter
    category: calendar
    formula: (trading_date.month - 1) // 3 + 1
    lookback_period: 0
    input_columns:
    - trading_date
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Calendar quarter integer (1 to 4).
    leakage_risk: none
    notes: null
  is_month_end:
    name: is_month_end
    category: calendar
    formula: 1 if next_calendar_day.month != current_month else 0
    lookback_period: 0
    input_columns:
    - trading_date
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Binary flag (1 or 0) indicating whether session is near the month-end
      expiry boundary.
    leakage_risk: none
    notes: null
