feature_count: 45
max_lookback: 200
features:
  ret_1d:
    name: ret_1d
    category: returns
    formula: (close_t / close_(t-1)) - 1
    lookback_period: 1
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 1-day close-to-close percentage price return.
    leakage_risk: none
    notes: null
  ret_2d:
    name: ret_2d
    category: returns
    formula: (close_t / close_(t-2)) - 1
