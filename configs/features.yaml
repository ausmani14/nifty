    lookback_period: 11
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: 1-day return lagged by 10 completed trading session(s).
    leakage_risk: none
    notes: null
  sma_5:
    name: sma_5
    category: moving_averages
    formula: 'mean(close_(t-5+1 : t))'
    lookback_period: 5
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 5-day simple moving average of closing price.
    leakage_risk: none
    notes: null
  close_to_sma_5:
    name: close_to_sma_5
    category: moving_averages
    formula: (close_t / sma_5) - 1
    lookback_period: 5
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Percentage distance of closing price from trailing 5-day SMA.
    leakage_risk: none
    notes: null
  sma_10:
    name: sma_10
    category: moving_averages
    formula: 'mean(close_(t-10+1 : t))'
    lookback_period: 10
    input_columns:
    - close
    snapshot_applicability:
