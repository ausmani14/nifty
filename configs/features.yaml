    category: moving_averages
    formula: 'mean(close_(t-200+1 : t))'
    lookback_period: 200
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 200-day simple moving average of closing price.
    leakage_risk: none
    notes: null
  close_to_sma_200:
    name: close_to_sma_200
    category: moving_averages
    formula: (close_t / sma_200) - 1
    lookback_period: 200
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Percentage distance of closing price from trailing 200-day SMA.
    leakage_risk: none
    notes: null
  mom_5d:
    name: mom_5d
    category: momentum
    formula: close_t - close_(t-5)
