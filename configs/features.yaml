    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: 1-day return lagged by 1 completed trading session(s).
    leakage_risk: none
    notes: null
  ret_lag_2:
    name: ret_lag_2
    category: lags
    formula: ret_1d_(t-2)
    lookback_period: 3
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: 1-day return lagged by 2 completed trading session(s).
    leakage_risk: none
