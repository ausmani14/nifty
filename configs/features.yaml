  volatility_5d:
    name: volatility_5d
    category: volatility
    formula: 'std_dev(ret_1d_(t-5+1 : t))'
    lookback_period: 6
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 5-day sample standard deviation of daily returns.
    leakage_risk: none
    notes: null
  volatility_10d:
    name: volatility_10d
    category: volatility
    formula: 'std_dev(ret_1d_(t-10+1 : t))'
    lookback_period: 11
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 10-day sample standard deviation of daily returns.
    leakage_risk: none
    notes: null
  volatility_20d:
    name: volatility_20d
    category: volatility
    formula: 'std_dev(ret_1d_(t-20+1 : t))'
    lookback_period: 21
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 20-day sample standard deviation of daily returns.
    leakage_risk: none
    notes: null
  volatility_60d:
    name: volatility_60d
    category: volatility
    formula: 'std_dev(ret_1d_(t-60+1 : t))'
    lookback_period: 61
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Trailing 60-day sample standard deviation of daily returns.
    leakage_risk: none
    notes: null
  volatility_ann_20d:
    name: volatility_ann_20d
    category: volatility
    formula: volatility_20d * sqrt(252)
    lookback_period: 21
    input_columns:
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Annualized trailing 20-day volatility assuming 252 trading sessions.
    leakage_risk: none
    notes: null
  hl_range_pct:
    name: hl_range_pct
    category: ohlc_shape
    formula: (high_t - low_t) / low_t
    lookback_period: 1
    input_columns:
    - high
    - low
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Intraday high-low range expressed as a percentage of low.
    leakage_risk: none
    notes: null
  close_pos_in_range:
    name: close_pos_in_range
    category: ohlc_shape
    formula: (close_t - low_t) / (high_t - low_t)
    lookback_period: 1
    input_columns:
    - high
    - low
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Close location within the daily high-low range [0.0, 1.0].
    leakage_risk: none
    notes: null
  open_to_close_ret:
    name: open_to_close_ret
    category: ohlc_shape
    formula: (close_t - open_t) / open_t
    lookback_period: 1
    input_columns:
    - open
    - close
    snapshot_applicability:
    - SNAPSHOT_1540
    - SNAPSHOT_0850
    description: Intraday session return from session open to official close.
    leakage_risk: none
    notes: null
  high_to_close_dist:
